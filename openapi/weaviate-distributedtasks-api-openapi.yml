openapi: 3.2.0
info:
  title: Weaviate REST Distributed Tasks API
  description: '# Introduction

    Weaviate is an open source, AI-native vector database that helps developers create intuitive and reliable AI-powered applications.'
  version: 1.38.0-dev
servers:
- url: http://localhost:8080
  description: Local Weaviate instance
security:
- ApiKeyAuth: []
- BearerAuth: []
tags:
- name: distributedTasks
paths:
  /tasks:
    get:
      summary: Weaviate Lists All Distributed Tasks In The Cluster
      tags:
      - distributedTasks
      operationId: distributedTasks.get
      responses:
        '200':
          description: Distributed tasks successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributedTasks'
        '403':
          description: Unauthorized or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal server error occurred while retrieving distributed tasks. Check the ErrorResponse for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 100
components:
  schemas:
    ErrorResponse:
      type: object
      description: An error response returned by Weaviate endpoints.
      properties:
        error:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
    DistributedTask:
      type: object
      description: Distributed task metadata.
      properties:
        id:
          type: string
          description: The ID of the task.
        version:
          type: integer
          description: The version of the task.
        status:
          type: string
          description: The status of the task.
        startedAt:
          type: string
          format: date-time
          description: The time when the task was created.
        finishedAt:
          type: string
          format: date-time
          description: The time when the task was finished.
        finishedNodes:
          type: array
          description: The nodes that finished the task.
          items:
            type: string
        error:
          type: string
          description: The high level reason why the task failed.
        payload:
          type: object
          description: The payload of the task.
        units:
          type: array
          description: Units of the task. Only present for tasks that use unit tracking.
          items:
            $ref: '#/components/schemas/DistributedTaskUnit'
    DistributedTasks:
      type: object
      description: Active distributed tasks by namespace.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/DistributedTask'
    DistributedTaskUnit:
      type: object
      description: A unit of a distributed task.
      properties:
        id:
          type: string
          description: The ID of the unit.
        nodeId:
          type: string
          description: The node that owns this unit.
        status:
          type: string
          description: The status of the unit.
        progress:
          type: number
          format: float
          description: The progress of the unit (0.0 to 1.0).
        error:
          type: string
          description: The error message if the unit failed.
        updatedAt:
          type: string
          format: date-time
          description: The time when the unit was last updated.
        finishedAt:
          type: string
          format: date-time
          description: The time when the unit finished.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC/JWT bearer authentication
